[project]
name = "campus-ai-service-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<9", "mypy>=1.15,<2", "types-jsonschema"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
